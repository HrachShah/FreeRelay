# FreeRelay Provider Catalog
# Auto-generated 2026-06-29. Edit last_verified when you probe a provider.

providers:
  - id: groq
    name: Groq
    base_url: https://api.groq.com/openai/v1
    default_model: llama-3.1-8b-instant
    models:
      - llama-3.1-8b-instant
      - llama-3.3-70b-versatile
      - mixtral-8x7b-32768
      - gemma2-9b-it
    auth_header: Bearer
    env_key: GROQ_API_KEY
    tier: free
    permanently_free: false
    rate_limits:
      rpm: 30
      tpm: 14400
    last_verified: "2026-06-29"
    notes: Ultra-low-latency LPU inference with a generous free tier.

