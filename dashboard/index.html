<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeRelay — Dashboard</title>
    <meta name="description" content="FreeRelay local AI proxy dashboard — monitor providers, test completions, and track usage.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Variables ──────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --bg-input: #1a1a26;
            --border-subtle: rgba(255,255,255,0.06);
            --border-active: rgba(139,92,246,0.4);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #555570;
            --accent-violet: #8b5cf6;
            --accent-violet-soft: rgba(139,92,246,0.15);
            --accent-cyan: #06b6d4;
            --accent-cyan-soft: rgba(6,182,212,0.15);
            --accent-emerald: #10b981;
            --accent-emerald-soft: rgba(16,185,129,0.15);
            --accent-amber: #f59e0b;
            --accent-amber-soft: rgba(245,158,11,0.15);
            --accent-rose: #f43f5e;
            --accent-rose-soft: rgba(244,63,94,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-glow: 0 0 30px rgba(139,92,246,0.08);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Background Effects ────────────────────────── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(139,92,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139,92,246,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            top: -200px;
            left: 50%;
            translate: -50% 0;
            width: 800px;
            height: 500px;
            background: radial-gradient(ellipse, rgba(139,92,246,0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Layout ────────────────────────────────────── */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ── Header ────────────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-group {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 20px rgba(139,92,246,0.25);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0f0f5 30%, var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .header-subtitle code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--accent-violet-soft);
            color: var(--accent-violet);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        /* ── Status Bar ────────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 36px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 8px rgba(16,185,129,0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-dot.offline {
            background: var(--accent-rose);
            box-shadow: 0 0 8px rgba(244,63,94,0.5);
            animation: none;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ── Cards ──────────────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: all var(--transition-smooth);
        }

        .card:hover {
            border-color: var(--border-active);
            box-shadow: var(--shadow-glow);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 16px;
        }

        /* ── Provider Grid ──────────────────────────────── */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .provider-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .provider-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            transition: opacity var(--transition-smooth);
        }

        .provider-card.groq::before { background: linear-gradient(90deg, #f97316, #fb923c); }
        .provider-card.google::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .provider-card.openrouter::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

        .provider-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .provider-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .provider-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .provider-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .provider-badge.online {
            background: var(--accent-emerald-soft);
            color: var(--accent-emerald);
        }

        .provider-badge.cooldown {
            background: var(--accent-amber-soft);
            color: var(--accent-amber);
        }

        .provider-badge.offline {
            background: var(--accent-rose-soft);
            color: var(--accent-rose);
        }

        .provider-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
        }

        .stat-value.requests { color: var(--accent-cyan); }
        .stat-value.errors { color: var(--accent-rose); }

        /* ── Playground ─────────────────────────────────── */
        .playground {
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 12px 14px;
            transition: border-color var(--transition-fast);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 0 3px var(--accent-violet-soft);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-violet), #7c3aed);
            color: white;
            box-shadow: 0 4px 14px rgba(139,92,246,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139,92,246,0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* ── Response Area ──────────────────────────────── */
        .response-area {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 16px;
            min-height: 120px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 16px;
            transition: border-color var(--transition-fast);
            max-height: 400px;
            overflow-y: auto;
        }

        .response-area.has-content {
            color: var(--text-primary);
            border-color: var(--accent-emerald-soft);
        }

        .response-area.has-error {
            color: var(--accent-rose);
            border-color: var(--accent-rose-soft);
        }

        .response-meta {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .response-meta span {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Quick Config ───────────────────────────────── */
        .quick-config {
            margin-bottom: 28px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .config-item {
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .config-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .config-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-cyan);
            background: var(--accent-cyan-soft);
            padding: 3px 8px;
            border-radius: 6px;
        }

        /* ── Scrollbar ──────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ── Spinner ────────────────────────────────────── */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        .btn-primary.loading .spinner { display: block; }
        .btn-primary.loading .btn-text { opacity: 0.7; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 700px) {
            .app-container { padding: 24px 16px 60px; }
            .providers-grid { grid-template-columns: 1fr; }
            .config-grid { grid-template-columns: 1fr; }
            .logo-text { font-size: 26px; }
        }

        /* ── Fade-in Animation ──────────────────────────── */
        .fade-in {
            animation: fadeIn 0.5s ease-out both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in:nth-child(2) { animation-delay: 0.08s; }
        .fade-in:nth-child(3) { animation-delay: 0.16s; }
        .fade-in:nth-child(4) { animation-delay: 0.24s; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header fade-in">
            <div class="logo-group">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">FreeRelay</span>
            </div>
            <p class="header-subtitle">
                Free AI, Zero Friction — proxy running at <code>localhost:8000</code>
            </p>
        </header>

        <!-- Status -->
        <div class="status-bar fade-in" id="statusBar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Connecting...</span>
        </div>

        <!-- Provider Cards -->
        <section class="providers-grid fade-in" id="providersGrid">
            <!-- Populated by JS -->
        </section>

        <!-- Quick Config -->
        <section class="card quick-config fade-in">
            <div class="card-title"><span class="icon">⚙️</span> Quick Reference</div>
            <div class="config-grid">
                <div class="config-item">
                    <span class="config-label">API Endpoint</span>
                    <span class="config-value">http://localhost:8000/v1</span>
                </div>
                <div class="config-item">
                    <span class="config-label">Models List</span>
                    <span class="config-value">GET /v1/models</span>
                </div>
                <div class="config-item">
                    <span class="config-label">Chat Completions</span>
                    <span class="config-value">POST /v1/chat/completions</span>
                </div>
                <div class="config-item">
                    <span class="config-label">API Key</span>
                    <span class="config-value">not required</span>
                </div>
            </div>
        </section>

        <!-- Playground -->
        <section class="card playground fade-in">
            <div class="card-title"><span class="icon">🧪</span> Playground</div>

            <div class="input-group">
                <label for="systemPrompt">System Prompt (optional)</label>
                <input type="text" id="systemPrompt" placeholder="You are a helpful assistant." value="You are a helpful assistant.">
            </div>

            <div class="input-group">
                <label for="userMessage">Message</label>
                <textarea id="userMessage" placeholder="Type your message here...">Hello! What's the capital of France?</textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="sendBtn" onclick="sendRequest()">
                    <div class="spinner"></div>
                    <span class="btn-text">Send Request</span>
                </button>
                <button class="btn btn-secondary" onclick="clearResponse()">Clear</button>
            </div>

            <div class="response-area" id="responseArea">Waiting for a request...</div>
            <div class="response-meta" id="responseMeta"></div>
        </section>
    </div>

    <script>
        // ── State ────────────────────────────────────────
        const BASE_URL = window.location.origin;
        let isLoading = false;

        // ── Poll Stats ───────────────────────────────────
        async function fetchStats() {
            try {
                const res = await fetch(`${BASE_URL}/v1/stats`);
                if (!res.ok) throw new Error('Stats fetch failed');
                const data = await res.json();
                renderProviders(data.providers);
                setStatus(true, `${data.providers.length} provider${data.providers.length !== 1 ? 's' : ''} active`);
            } catch (err) {
                setStatus(false, 'Cannot reach FreeRelay server');
                document.getElementById('providersGrid').innerHTML = renderOfflineCard();
            }
        }

        function setStatus(online, text) {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            dot.className = online ? 'status-dot' : 'status-dot offline';
            txt.textContent = text;
        }

        // ── Render Providers ─────────────────────────────
        function renderProviders(providers) {
            const grid = document.getElementById('providersGrid');
            if (!providers || providers.length === 0) {
                grid.innerHTML = renderOfflineCard();
                return;
            }
            grid.innerHTML = providers.map(p => {
                const statusClass = !p.is_available ? 'cooldown' : 'online';
                const statusLabel = !p.is_available ? `COOLDOWN ${p.cooldown_remaining}s` : 'ONLINE';
                return `
                    <div class="provider-card ${p.name}">
                        <div class="provider-header">
                            <span class="provider-name">${capitalize(p.name)}</span>
                            <span class="provider-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="provider-stats">
                            <div class="stat-box">
                                <div class="stat-label">Requests</div>
                                <div class="stat-value requests">${p.request_count}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Errors</div>
                                <div class="stat-value errors">${p.error_count}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderOfflineCard() {
            return `
                <div class="provider-card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                    <p style="color: var(--text-muted); font-size: 15px;">
                        No providers available. Make sure FreeRelay is running and API keys are configured.
                    </p>
                </div>
            `;
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // ── Send Request ─────────────────────────────────
        async function sendRequest() {
            if (isLoading) return;

            const systemPrompt = document.getElementById('systemPrompt').value.trim();
            const userMessage = document.getElementById('userMessage').value.trim();
            const responseArea = document.getElementById('responseArea');
            const responseMeta = document.getElementById('responseMeta');
            const btn = document.getElementById('sendBtn');

            if (!userMessage) {
                responseArea.textContent = 'Please enter a message.';
                responseArea.className = 'response-area has-error';
                return;
            }

            // Build messages
            const messages = [];
            if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
            messages.push({ role: 'user', content: userMessage });

            // UI loading state
            isLoading = true;
            btn.classList.add('loading');
            btn.disabled = true;
            responseArea.textContent = 'Sending...';
            responseArea.className = 'response-area';
            responseMeta.innerHTML = '';

            const startTime = performance.now();

            try {
                const res = await fetch(`${BASE_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages, stream: false }),
                });

                const data = await res.json();
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);

                if (data.error) {
                    responseArea.textContent = `Error: ${data.error.message}`;
                    responseArea.className = 'response-area has-error';
                    return;
                }

                const content = data.choices?.[0]?.message?.content || 'No content in response.';
                responseArea.textContent = content;
                responseArea.className = 'response-area has-content';

                const usage = data.usage || {};
                responseMeta.innerHTML = `
                    <span>⏱ ${elapsed}s</span>
                    <span>📥 ${usage.prompt_tokens || '?'} prompt tokens</span>
                    <span>📤 ${usage.completion_tokens || '?'} completion tokens</span>
                    <span>🤖 ${data.model || 'unknown'}</span>
                `;

                // Refresh stats
                fetchStats();

            } catch (err) {
                responseArea.textContent = `Connection error: ${err.message}`;
                responseArea.className = 'response-area has-error';
            } finally {
                isLoading = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function clearResponse() {
            const responseArea = document.getElementById('responseArea');
            responseArea.textContent = 'Waiting for a request...';
            responseArea.className = 'response-area';
            document.getElementById('responseMeta').innerHTML = '';
        }

        // ── Keyboard shortcut ────────────────────────────
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                sendRequest();
            }
        });

        // ── Init ─────────────────────────────────────────
        fetchStats();
        setInterval(fetchStats, 5000);  // Poll every 5s
    </script>
</body>
</html>
